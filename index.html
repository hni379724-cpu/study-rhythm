<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>学习节奏</title>
<meta name="theme-color" content="#F4F2ED">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习节奏">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="icon" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F4F2ED;
  --card:#FFFFFF;
  --ink:#1F1D1A;
  --ink-2:#67625B;
  --ink-3:#9C968D;
  --sep:rgba(0,0,0,.06);
  --sep-2:rgba(0,0,0,.09);
  --fill:#EFECE5;
  --fill-2:#E6E2D9;
  --amber:#CE8E12;
  --amber-2:#E9B44C;
  --amber-3:#F6E3BC;
  --amber-4:#FCF4E3;
  --quiet:#DEE1DB;
  --quiet-2:#E9EBE6;
  --danger:#9E4B3C;
  --nav-h:calc(56px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.32,.72,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text",system-ui,"MiSans","HarmonyOS Sans SC","PingFang SC","Source Han Sans SC","Noto Sans SC",sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:600}
button,input{font-family:inherit;letter-spacing:inherit}

/* ---------- 骨架 ---------- */
#hdr{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
  background:rgba(244,242,237,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  transition:box-shadow .3s,border-color .3s;border-bottom:1px solid transparent}
#hdr.stuck{border-bottom-color:var(--sep)}
#hdr .bar{height:44px;display:flex;align-items:center;justify-content:center;position:relative}
#hdr .small{font-size:16px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
#hdr.stuck .small{opacity:1;transform:none}
main{padding:0 16px calc(var(--nav-h) + 28px);max-width:680px;margin:0 auto}
.view{display:none;animation:fadeUp .34s var(--ease)}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big-title{font-size:33px;font-weight:700;letter-spacing:-.028em;padding:6px 4px 2px}
.sub-title{color:var(--ink-3);font-size:14.5px;padding:0 4px 16px}

/* ---------- 卡片 / 列表 ---------- */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 1px rgba(40,35,25,.04),0 10px 24px -20px rgba(40,35,25,.5)}
.card.tight{padding:6px 18px}
.ttl{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin-bottom:13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl .n{font-family:var(--mono);color:var(--amber)}
.lab{font-size:12.5px;color:var(--ink-3);margin:17px 0 8px}
.rowline{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--sep)}
.rowline:first-child{border-top:0}
.rowline .grow{flex:1;min-width:0}
.rowline .val{font-family:var(--mono);font-size:14px;color:var(--ink-3)}
.chev{color:#C8C2B8;flex:none}

/* ---------- 触感按钮 ---------- */
.tap{transition:transform .16s var(--ease),background .18s,border-color .18s,opacity .18s}
.tap:active{transform:scale(.955)}
input[type=text]{width:100%;font-size:17px;color:var(--ink);background:var(--fill);border:1px solid transparent;
  border-radius:13px;padding:14px;outline:none;transition:.2s var(--ease)}
input[type=text]:focus{background:#fff;border-color:var(--amber-2);box-shadow:0 0 0 4px var(--amber-4)}
input[type=number]{width:120px;font-family:var(--mono);font-size:16px;background:var(--fill);border:1px solid transparent;
  border-radius:11px;padding:10px 13px;outline:none;color:var(--ink)}
input[type=time]{font-family:var(--mono);font-size:16px;border:1px solid var(--sep-2);background:var(--fill);
  border-radius:10px;padding:7px 10px;color:var(--ink);outline:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--sep-2);background:var(--card);color:var(--ink-2);border-radius:999px;
  padding:9px 16px;font-size:14.5px;cursor:pointer;user-select:none;
  transition:transform .16s var(--ease),background .2s,border-color .2s,color .2s}
.tag:active{transform:scale(.94)}
.tag.on{background:var(--amber-4);border-color:var(--amber-2);color:#8A5E08;font-weight:500}
.tag.num{font-family:var(--mono)}
.btn{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;cursor:pointer;width:100%;
  background:var(--amber);color:#fff;margin-top:20px;transition:transform .16s var(--ease),background .2s}
.btn:active{transform:scale(.975);background:#B87D0B}
.ghost{background:var(--fill);border:0;color:var(--ink-2);padding:9px 15px;font-size:14px;border-radius:11px;
  cursor:pointer;transition:transform .16s var(--ease),background .2s}
.ghost:active{transform:scale(.94);background:var(--fill-2)}
.mini{font-size:13.5px;border:1px solid var(--sep-2);background:var(--card);color:var(--ink-2);border-radius:10px;
  padding:8px 14px;cursor:pointer;transition:transform .16s var(--ease),background .2s,border-color .2s,color .2s}
.mini:active{transform:scale(.92)}
.mini.on{background:var(--amber-4);border-color:var(--amber-2);color:#8A5E08}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* iOS 开关 */
.sw{width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;
  transition:background .28s var(--ease)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .32s var(--ease)}
.sw.on{background:var(--amber)}
.sw.on i{transform:translateX(20px)}

/* 分段控件 */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;color:var(--ink-2);padding:8px 4px;border-radius:9px;
  cursor:pointer;font-weight:500;transition:background .28s var(--ease),color .2s,transform .16s var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,35,25,.13)}

/* ---------- 底部导航 ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(244,242,237,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep)}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink-3);font-size:10.5px;cursor:pointer;transition:color .2s,transform .16s var(--ease)}
#tabs button:active{transform:scale(.9)}
#tabs button.on{color:var(--amber)}
#tabs svg{width:23px;height:23px;stroke-width:1.7;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
#tabs .dot{position:absolute;top:7px;margin-left:15px;width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* ---------- 内容元素 ---------- */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--sep)}
.item:first-child{border-top:0}
.item .c{flex:1;min-width:0}
.item .t{font-size:15.5px;line-height:1.4}
.item .m{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
.item .min{font-family:var(--mono);font-size:14.5px;color:var(--amber);flex:none;width:62px;text-align:right}
.note{font-size:14px;color:var(--ink-2);margin-top:5px;padding-left:10px;border-left:2px solid var(--amber-3)}
.steps{display:flex;gap:5px;margin-top:8px}
.step{width:7px;height:7px;border-radius:50%;background:var(--quiet)}
.step.done{background:var(--amber-2)}
.step.now{background:var(--amber);box-shadow:0 0 0 3px var(--amber-4)}
.del{border:0;background:none;color:#CFCAC1;cursor:pointer;font-size:18px;padding:0 2px;line-height:1}
.empty{color:var(--ink-3);font-size:15px;padding:6px 0;line-height:1.6}
.line{font-size:15.5px;color:var(--ink-2);line-height:1.72}
.line b{color:var(--ink);font-family:var(--mono);font-weight:500;letter-spacing:-.02em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat .k{font-family:var(--mono);font-size:23px;letter-spacing:-.03em;line-height:1.25}
.stat .u{font-size:12px;color:var(--ink-3)}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:2px}
.day{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--sep)}
.day:first-child{border-top:0}
.day .when{font-size:14.5px;width:40px;flex:none;color:var(--ink-2)}
.day .frac{font-family:var(--mono);font-size:14px;color:var(--ink);width:48px;flex:none;letter-spacing:-.02em}
.day .frac.none{color:var(--ink-3)}
.day .boxes{flex:1;min-width:0;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.day .box{width:15px;height:15px;border-radius:5px;background:var(--amber);flex:none;
  transition:background .45s var(--ease),opacity .45s var(--ease),transform .45s var(--ease)}
.day .box.done{background:var(--fill);opacity:.7;transform:scale(.86)}
.day .more{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.day .tail{font-size:12.5px;color:var(--ink-3);flex:none;text-align:right}
.day .tail.none{color:#BDB7AC}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px}
.heatcol{display:flex;flex-direction:column;gap:3px}
.cell{width:13px;height:13px;border-radius:3.5px;background:var(--quiet-2)}
.legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.legend .cell{width:11px;height:11px}
.frow{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.frow .fk{width:30px;flex:none;font-size:12.5px;color:var(--ink-3)}
.frow .tags{flex:1;min-width:0}
.gotline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
.gotn{font-family:var(--mono);font-size:13px;color:var(--amber);font-weight:600;margin-right:2px}
.gotchip{font-size:12.5px;color:var(--ink-2);background:var(--amber-4);border-radius:8px;padding:4px 9px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--sep)}
.dayrow:first-child{border-top:0;padding-top:2px}
.dayrow .dk{width:40px;flex:none;font-size:14.5px;color:var(--ink-2);padding-top:8px;line-height:1.2}
.dayrow .dk span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.dayrow .tags{flex:1;gap:7px}
.dayrow .tag{padding:8px 13px}
.dayrow input[type=time]{padding:6px 8px;font-size:14px}
.daysum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--ink-3)}
.daysum b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:16px}
.chartscroll{overflow-x:auto;overflow-y:hidden;margin:0 -18px;padding:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chartscroll::-webkit-scrollbar{display:none}
.chartscroll svg.chart{max-width:none;width:auto;flex:none}
.axispin{position:absolute;left:-18px;top:0;z-index:2;pointer-events:none;transition:opacity .2s}
.axispin svg{display:block}
.legrow{display:flex;flex-wrap:nowrap;gap:4px;margin-top:10px;align-items:center;
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.legrow::-webkit-scrollbar{display:none}
.legrow i{display:inline-block;width:14px;vertical-align:middle;margin-right:5px}
.legrow .still{padding:4px 6px}
.legchip{cursor:pointer;user-select:none;padding:4px 7px;border-radius:8px;transition:opacity .2s,background .2s}
.legchip:active{background:var(--fill)}
.legchip.off{opacity:.34}
svg.chart{display:block;max-width:100%}
circle.grow{transition:r 950ms var(--ease)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:9px 0;border-top:1px solid var(--sep);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.n{font-family:var(--mono);text-align:right;color:var(--ink-3);white-space:nowrap;padding-left:12px;font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--amber-2);min-width:4px}
.bar.dim{background:var(--quiet)}
/* 台账 */
.lgwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.lg{border-collapse:separate;border-spacing:0;font-size:14px}
.lg th{font-size:11.5px;font-weight:500;color:var(--ink-3);text-align:center;padding:0 0 8px;white-space:nowrap;font-family:var(--mono)}
.lg th.l{text-align:left}
.lg td{border-top:1px solid var(--sep);padding:11px 0;vertical-align:top}
.lg tr:first-child td{border-top:0}
.lg .cd{white-space:nowrap;padding-right:14px}
.lg .cd .d{font-family:var(--mono);font-size:14.5px}
.lg .cd .h{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);display:block}
.lg .cc{min-width:148px;padding-right:14px}
.lg .cc .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.lg .rc{text-align:center;padding:11px 5px;width:52px}
.rcell{display:inline-block;font-family:var(--mono);font-size:11.5px;line-height:1;padding:7px;border-radius:8px;
  min-width:44px;background:var(--fill);color:var(--ink-3);border:1px solid transparent;transition:transform .16s var(--ease)}
.rcell.done{background:var(--amber-4);color:#8A5E08;border-color:var(--amber-3)}
.rcell.due{background:var(--amber);color:#fff;cursor:pointer;font-weight:600}
.rcell.due:active{transform:scale(.9)}
.rcell.soon{background:transparent;border:1px dashed var(--sep-2);cursor:pointer;color:var(--ink-2)}
.rcell.soon:active{transform:scale(.9)}
.rcell.none{background:transparent;color:#D2CCC2}
.rpick{display:flex;gap:3px;justify-content:center}
.rpick button{border:1px solid var(--amber-2);background:#fff;color:#8A5E08;font-size:11px;border-radius:7px;
  padding:6px 5px;cursor:pointer;min-width:26px}
/* 提示条 */
.banner{display:flex;align-items:center;gap:12px;background:var(--amber-4);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.banner .txt{flex:1;font-size:14px;color:#7A5308;line-height:1.5}
.banner button{border:0;background:var(--amber);color:#fff;font-size:13.5px;font-weight:600;border-radius:10px;
  padding:9px 14px;cursor:pointer;flex:none;transition:transform .16s var(--ease)}
.banner button:active{transform:scale(.93)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(28,26,23,.94);color:#fff;padding:12px 20px;border-radius:15px;font-size:15px;z-index:99;
  transition:opacity .26s var(--ease),transform .26s var(--ease);backdrop-filter:blur(10px);max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;font-size:14px;color:var(--ink-3);list-style:none;outline:none;padding:6px 0}
details summary::-webkit-details-marker{display:none}
@media(max-width:380px){ .grid4{grid-template-columns:repeat(2,1fr);gap:14px} .big-title{font-size:30px} }
@media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important} }
</style>
</head>
<body>

<header id="hdr"><div class="bar"><span class="small" id="hdrTitle">今天</span></div></header>

<main>
  <!-- ========== 今天 ========== -->
  <section class="view on" id="v-today">
    <div class="big-title">今天</div>
    <div class="sub-title" id="todayDate"></div>
    <div id="notifBanner"></div>

    <div class="card">
      <div class="ttl"><span>接下来三天</span></div>
      <div id="plan"></div>
      <div id="dueList" style="margin-top:4px"></div>
    </div>

    <div class="card">
      <div class="ttl"><span>精神</span><button class="ghost tap" id="dayEdit" style="display:none">改</button></div>
      <div id="dayBody"></div>
    </div>

    <div class="card">
      <div class="ttl"><span id="entryTitle">记一笔</span>
        <button class="ghost tap" id="backfillBtn">补签</button></div>
      <div id="backfillRow" style="display:none;margin-bottom:12px" class="row">
        <input type="date" id="backfillDate">
        <button class="ghost tap" id="backfillCancel">取消</button>
      </div>
      <input type="text" id="content" autocomplete="off" enterkeyhint="next">
      <div class="lab">时长</div>
      <div class="tags" id="durTags"></div>
      <div style="display:none;margin-top:10px;align-items:center;gap:10px" id="customDurRow">
        <input type="number" id="customDur" min="1" max="1440" inputmode="numeric"><span class="line" style="font-size:14px">分钟</span>
      </div>
      <div class="frow"><div class="fk">状态</div><div class="tags" id="moodTags"></div></div>
      <div class="frow"><div class="fk">压力</div><div class="tags" id="stressTags"></div></div>
      <div class="lab">搞懂了什么 <span style="opacity:.7">· 用逗号隔开，一段一件</span></div>
      <input type="text" id="note" autocomplete="off" enterkeyhint="done">
      <div id="gotPreview"></div>
      <div class="frow"><div class="fk">地点</div><div class="tags" id="locTags"></div></div>
      <div id="timeRow" class="frow" style="font-size:13.5px;color:var(--ink-3);gap:10px"></div>

      <button class="btn" id="saveBtn">记下来</button>
    </div>

    <div class="card">
      <div class="ttl"><span>今天的记录</span><span class="n" id="todaySum"></span></div>
      <div id="todayRecs"></div>
    </div>
  </section>

  <!-- ========== 台账 ========== -->
  <section class="view" id="v-ledger">
    <div class="big-title">台账</div>
    <div class="sub-title">每一行是一次学习，横着是它的回顾链</div>
    <div class="card">
      <div class="ttl"><span id="lgCount"></span>
        <span style="display:flex;gap:6px">
          <button class="ghost" id="lgToggle">回顾中</button>
          <button class="ghost" id="csvBtn">CSV</button>
        </span>
      </div>
      <div id="ledger"></div>
    </div>
  </section>

  <!-- ========== 数据 ========== -->
  <section class="view" id="v-data">
    <div class="big-title">数据</div>
    <div class="sub-title" id="dataSub"></div>
    <div class="card">
      <div class="grid4" id="stats"></div>
      <div class="line" id="summary" style="margin-top:18px"></div>
    </div>
    <div class="card">
      <div class="seg" id="segChart">
        <button data-v="daily" class="on">日课</button><button data-v="spirit">精神</button><button data-v="heat">90 天</button><button data-v="radius">半径</button>
      </div>
      <div id="chartWrap"></div>
    </div>
    <div class="card">
      <div class="seg" id="segInsight">
        <button data-v="hour" class="on">时段</button><button data-v="place">地点</button><button data-v="week">星期</button>
      </div>
      <div id="insightWrap"></div>
    </div>
    <div class="card">
      <div class="ttl"><span>内容库</span></div>
      <div class="tags" id="subjFilter" style="margin-bottom:12px"></div>
      <div id="library"></div>
    </div>
    <div class="card">
      <details><summary>更早的记录 ›</summary><div id="allRecs" style="margin-top:12px"></div></details>
    </div>
  </section>

  <!-- ========== 设置 ========== -->
  <section class="view" id="v-set">
    <div class="big-title">设置</div>
    <div class="sub-title">提醒、导出、数据</div>

    <div class="card tight">
      <div class="rowline">
        <div class="grow"><div>每日提醒</div>

        <button class="ghost tap" id="icsBtn">导出</button></div>

        数据只存在这台手机里，不上传。清除浏览器数据或卸载会一起清掉，所以每月导出一次 JSON。

  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v9l5 3"/><circle cx="12" cy="12" r="9"/></svg><span>今天</span></button>

<div id="toast"></div>

<script>
/* ================= 常量 ================= */
var KEY='study-rhythm-v1';
var LOCS=['教室','图书馆','其他'];
var MOODS=['顺','一般','卡'];
var DURS=[30,60,90,120];
var MOODVAL={'卡':1,'一般':2,'顺':3};
var OFFSETS=[1,3,7,16,35];
var HOURBANDS=[{k:'清晨',s:5,e:8},{k:'上午',s:8,e:12},{k:'午后',s:12,e:14},
  {k:'下午',s:14,e:18},{k:'傍晚',s:18,e:22},{k:'深夜',s:22,e:29}];

/* ================= 触感 ================= */
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||8); }catch(e){} }
function buzzOK(){ try{ if(navigator.vibrate) navigator.vibrate([12,50,18]); }catch(e){} }

/* ================= 存储 ================= */
var db={records:[],reviews:[],mastery:{},notify:{on:false,time:'08:00'},
  ics:{at:null,days:{},legacyIds:[]},backfill:{},daily:{}}, storageOK=true;
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'{}');
    db.records=Array.isArray(d.records)?d.records:[];
    db.reviews=Array.isArray(d.reviews)?d.reviews:[];
    db.mastery=(d.mastery&&typeof d.mastery==='object')?d.mastery:{};
    if(d.notify) db.notify={on:!!d.notify.on,time:d.notify.time||'08:00'};
    if(d.ics) db.ics={at:d.ics.at||null,days:(d.ics.days&&typeof d.ics.days==='object')?d.ics.days:{},
      legacyIds:Array.isArray(d.ics.ids)?d.ics.ids:(d.ics.legacyIds||[])};
    if(d.calHour) db.calHour=d.calHour;
    if(d.backfill&&typeof d.backfill==='object') db.backfill=d.backfill;
    if(d.daily&&typeof d.daily==='object') db.daily=d.daily;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ storageOK=false; toast('这次没存进浏览器，记得导出备份'); }
  mirrorToIDB();
}

/* ================= 工具 ================= */
function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYMD(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function todayStr(){ return ymd(today()); }
function addDays(s,n){ var d=parseYMD(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a,b){ return Math.round((parseYMD(b)-parseYMD(a))/86400000); }
function md(s){ var d=parseYMD(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function hm(dt){ return pad(dt.getHours())+':'+pad(dt.getMinutes()); }
function fmtDur(m){ m=Math.round(m||0); if(m<60) return m+' 分';
  var h=Math.floor(m/60),r=m%60; return r? h+' 小时 '+r+' 分' : h+' 小时'; }
function hnum(m){ return Math.round((m||0)/6)/10; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(h){ var t=document.createElement('div'); t.innerHTML=h.trim(); return t.firstChild; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2400); }
function subjectOf(c){ var s=String(c||'').trim(); return s.split(/[\s·、\/\-—:：]+/)[0]||s.slice(0,4)||'未分类'; }
function median(a){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;}),m=Math.floor(b.length/2);
  return b.length%2? b[m]:(b[m-1]+b[m])/2; }
function minutesByDay(){ var m={}; db.records.forEach(function(r){ m[r.date]=(m[r.date]||0)+(+r.minutes||0); }); return m; }
function lastNDays(n){ var o=[],t=today(); for(var i=n-1;i>=0;i--){ var d=new Date(t); d.setDate(d.getDate()-i); o.push(ymd(d)); } return o; }
function toMin(t){ var p=String(t||'').split(':'); return p.length===2?(+p[0])*60+(+p[1]):null; }

/* ================= IndexedDB 镜像（给 Service Worker 读） ================= */
function idbOpen(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('rhythm',1);
    r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function mirrorToIDB(){
  if(!('indexedDB' in window)) return Promise.resolve();
  var days={};
  for(var i=0;i<21;i++){
    var d=addDays(todayStr(),i);
    var list=(i===0? dueToday() : dueOn(d)).map(function(r){ return {c:r.content,round:r.round}; });
    if(list.length) days[d]=list;
  }
  var snap={on:!!(db.notify&&db.notify.on), time:(db.notify&&db.notify.time)||'08:00', days:days, updated:Date.now()};
  return idbOpen().then(function(d){
    return new Promise(function(res){
      var tx=d.transaction('kv','readwrite');
      var st=tx.objectStore('kv');
      var g=st.get('daily');
      g.onsuccess=function(){
        var old=g.result||{};
        snap.lastNotified=old.lastNotified||'';
        st.put(snap,'daily');
      };
      tx.oncomplete=function(){ d.close(); res(); };
      tx.onerror=function(){ res(); };
    });
  }).catch(function(){});
}

/* ================= 复习 ================= */
function pendings(){ return db.reviews.filter(function(r){return r.status==='pending';}); }
/* 断档太久的处理：晚几天照常做；晚过一整个间隔的两倍，说明这块已经
   忘得差不多了，把它拉回今天，后面几轮按「卡」的密度压缩重排。
   不作废、不惩罚、不提示——只是让排期回到现实。 */
function catchUp(){
  var t=todayStr(),changed=false,bySrc={};
  pendings().forEach(function(r){ (bySrc[r.sourceId]=bySrc[r.sourceId]||[]).push(r); });
  Object.keys(bySrc).forEach(function(sid){
    var list=bySrc[sid].sort(function(a,b){return a.round-b.round;});
    var first=list[0],over=daysBetween(first.dueDate,t);
    if(over<=0) return;
    var gap=first.round>1? OFFSETS[first.round-1]-OFFSETS[first.round-2] : OFFSETS[0];
    if(over<=gap*2) return;
    first.dueDate=t; changed=true;
    list.slice(1).forEach(function(x){
      var g=OFFSETS[x.round-1]-OFFSETS[first.round-1];
      x.dueDate=addDays(t,Math.max(x.round-first.round,Math.round(g*0.5)));
    });
  });
  if(changed) save();
}
/* 某一天已经回顾掉的条数：今天看当天完成的，未来那几天看提前做掉的 */
function doneOn(date,isToday){
  return db.reviews.filter(function(r){
    if(r.status!=='done') return false;          // 「熟了」是退出队列，不是完成
    if(isToday) return r.completedAt && ymd(new Date(r.completedAt))===date;
    return r.dueDate===date;
  }).length;
}
/* 同一条内容只保留最靠前的那一轮，避免同一天重复出现 */
function firstPerSource(list){
  var seen={},out=[];
  list.sort(function(a,b){ return a.dueDate!==b.dueDate? (a.dueDate<b.dueDate?-1:1) : a.round-b.round; })
    .forEach(function(r){ if(seen[r.sourceId]) return; seen[r.sourceId]=1; out.push(r); });
  return out;
}
function dueToday(){ var t=todayStr();
  return firstPerSource(pendings().filter(function(r){ return daysBetween(r.dueDate,t)>=0; })); }
/* 某一天排着的回顾。同一天同一条内容只算一次；
   不因为它有更早的轮次欠着就把这一天的安排藏起来——藏了明天后天就永远是空的。 */
function dueOn(date){
  return firstPerSource(pendings().filter(function(r){ return r.dueDate===date; }));
}
function reviewsOf(id){ return db.reviews.filter(function(x){return x.sourceId===id;})
  .sort(function(a,b){return a.round-b.round;}); }
/* 学的当天就把五轮全排出来：1 / 3 / 7 / 16 / 35 天。
   排满了台账才看得见规律，日历才导得出未来几周，每一轮也才能单独勾。 */
function schedulePlan(rec){
  OFFSETS.forEach(function(off,i){
    db.reviews.push({id:uid(),sourceId:rec.id,content:rec.content,dueDate:addDays(rec.date,off),
      round:i+1,status:'pending',completedAt:null});
  });
}
/* 老数据只排了第 1 轮，这里补齐后面几轮 */
function migratePlans(){
  var changed=false;
  db.records.forEach(function(rec){
    var rv=reviewsOf(rec.id);
    if(!rv.length) return;                                   // 不是新学，或已整条退出
    if(rv.some(function(x){return x.status==='retired';})) return;
    var maxRound=Math.max.apply(null,rv.map(function(x){return x.round;}));
    if(maxRound>=OFFSETS.length) return;
    var last=rv.filter(function(x){return x.round===maxRound;})[0];
    var base=last.status==='done'&&last.completedAt? ymd(new Date(last.completedAt)) : last.dueDate;
    for(var k=maxRound+1;k<=OFFSETS.length;k++){
      db.reviews.push({id:uid(),sourceId:rec.id,content:rec.content,
        dueDate:addDays(base,OFFSETS[k-1]-OFFSETS[maxRound-1]),
        round:k,status:'pending',completedAt:null});
      changed=true;
    }
  });
  if(changed) save();
}
/* 完成一轮后，把这一条内容剩下的轮次整体重排：
   标「卡」缩到一半（忘得快，追着问）；标「顺」拉长三成；「一般」照表走。 */
function reflow(sourceId,doneRound,mood){
  var f = mood==='卡'?0.5 : (mood==='顺'?1.3:1);
  var base=todayStr(), next=null;
  db.reviews.filter(function(x){
    return x.sourceId===sourceId && x.status==='pending' && x.round>doneRound;
  }).sort(function(a,b){return a.round-b.round;}).forEach(function(x){
    var gap=OFFSETS[x.round-1]-OFFSETS[doneRound-1];
    x.dueDate=addDays(base, Math.max(x.round-doneRound, Math.round(gap*f)));
    if(!next) next=x;
  });
  return next;
}
function completeReview(id,mood){
  var r=db.reviews.filter(function(x){return x.id===id;})[0]; if(!r) return;
  r.status='done'; r.completedAt=new Date().toISOString(); r.mood=mood;
  var next=reflow(r.sourceId,r.round,mood);
  toast(next? '下次回顾 '+md(next.dueDate)+'（'+daysBetween(todayStr(),next.dueDate)+' 天后）'
            : '这块的五轮走完了');
  buzzOK(); save(); renderAll(); scheduleNotifications();
}
function retire(sourceId){
  db.reviews.forEach(function(r){ if(r.sourceId===sourceId&&r.status==='pending') r.status='retired'; });
  buzz(14); save(); renderAll(); scheduleNotifications(); toast('好，不再提醒这块');
}

/* ================= 今天 · 三天计划 ================= */
function renderPlan(){
  var wrap=document.getElementById('plan'), t=todayStr(), CAP=5;
  var due=dueToday();
  var d1=dueOn(addDays(t,1)), d2=dueOn(addDays(t,2));
  var rows=[['今天',t,due],['明天',addDays(t,1),d1],['后天',addDays(t,2),d2]];
  wrap.innerHTML=rows.map(function(r){
    /* 分母是当天真实的总数，完成一条只会让暗格变多，分母不动 */
    var day=r[1],left=r[2].length,done=doneOn(day,day===t),total=done+left;
    var CAPB=10,boxes='';
    if(total){
      var show=Math.min(total,CAPB),shownDone=Math.min(done,show);
      for(var i=0;i<show;i++) boxes+='<span class="box'+(i<shownDone?' done':'')+'"></span>';
      if(total>CAPB) boxes+='<span class="more">+'+(total-CAPB)+'</span>';
    }
    return '<div class="day">'+
      '<div class="when">'+r[0]+'</div>'+
      '<div class="frac'+(total?'':' none')+'">'+(total? done+' / '+total : '—')+'</div>'+
      (total? '<div class="boxes">'+boxes+'</div>'
            : '<div class="tail none">没有安排</div>')+
      (total&&!left? '<div class="tail">清完了</div>':'')+
      '</div>';
  }).join('');

  var list=document.getElementById('dueList');
  if(!due.length){
    list.innerHTML='<div class="empty" style="padding-top:14px;border-top:1px solid var(--sep);margin-top:8px">'+
      (pendings().length? '今天没有排到的回顾。' : '还没有排上回顾。把类型标成「新学」，回顾链会自动排。')+'</div>';
    return;
  }
  list.innerHTML='<div style="border-top:1px solid var(--sep);margin-top:8px"></div>';
  due.slice(0,CAP).forEach(function(r){
    var over=daysBetween(r.dueDate,t);
    var dots=OFFSETS.map(function(_,i){
      return '<span class="step '+(i+1<r.round?'done':(i+1===r.round?'now':''))+'"></span>'; }).join('');
    var node=el('<div class="item"><div class="c">'+
      '<div class="t">'+esc(r.content)+'</div>'+
      '<div class="m">第 '+r.round+' 次 · '+(over===0?'今天':'原定 '+md(r.dueDate))+'</div>'+
      '<div class="steps">'+dots+'</div>'+
      '<div class="acts">'+MOODS.map(function(m){return '<button class="mini" data-m="'+m+'">'+m+'</button>';}).join('')+
      '<button class="mini" data-r="1" style="opacity:.7">熟了</button></div></div></div>');
    node.querySelectorAll('.mini').forEach(function(b){
      b.onclick=function(){ buzz(10);
        if(b.getAttribute('data-r')) retire(r.sourceId);
        else completeReview(r.id,b.getAttribute('data-m')); };
    });
    list.appendChild(node);
  });
  if(due.length>CAP) list.appendChild(el('<div class="empty" style="font-size:13.5px">还有 '+(due.length-CAP)+
    ' 条排在后面，清完这几条它们才露面。一次五条就够。</div>'));
}

/* ================= 通知 ================= */
var NOTIF={
  api:('Notification' in window),
  triggers:('Notification' in window && 'showTrigger' in Notification.prototype),
  periodic:false,
  perm:('Notification' in window? Notification.permission:'unsupported')
};
function notifBody(list){
  var names=list.slice(0,3).map(function(r){return r.content;}).join('、');
  return names+(list.length>3? ' 等 '+list.length+' 条':'');
}
async function askNotifPermission(){
  if(!NOTIF.api){ toast('这个浏览器不支持通知'); return false; }
  var p=await Notification.requestPermission();
  NOTIF.perm=p;
  if(p!=='granted'){ toast('没有拿到通知权限'); return false; }
  return true;
}
async function scheduleNotifications(){
  if(!NOTIF.api || Notification.permission!=='granted') return;
  var reg=null;
  try{ reg=await navigator.serviceWorker.ready; }catch(e){ return; }
  // 清掉旧的排程
  try{
    var olds=await reg.getNotifications({includeTriggered:true,tag:''});
    olds.forEach(function(n){ if(n.tag&&n.tag.indexOf('daily-')===0) n.close(); });
  }catch(e){}
  if(!db.notify.on) return;
  if(!NOTIF.triggers) return;               // 退到后台检查通道
  var tm=toMin(db.notify.time)||480;
  for(var i=0;i<14;i++){
    var date=addDays(todayStr(),i);
    var list=(i===0? dueToday() : dueOn(date));
    if(!list.length) continue;
    var d=parseYMD(date); d.setHours(Math.floor(tm/60),tm%60,0,0);
    if(d.getTime()<=Date.now()+30000) continue;
    try{
      await reg.showNotification('今天要回顾 '+list.length+' 条',{
        tag:'daily-'+date, body:notifBody(list), icon:'icon-192.png', badge:'icon-192.png',
        showTrigger:new TimestampTrigger(d.getTime()), data:{url:'./index.html'},
        requireInteraction:false, silent:false
      });
    }catch(e){}
  }
}
async function registerPeriodic(){
  try{
    var reg=await navigator.serviceWorker.ready;
    if(!('periodicSync' in reg)) return false;
    var st=await navigator.permissions.query({name:'periodic-background-sync'});
    if(st.state!=='granted') return false;
    await reg.periodicSync.register('daily-review',{minInterval:12*60*60*1000});
    NOTIF.periodic=true; return true;
  }catch(e){ return false; }
}
async function testNotification(){
  if(Notification.permission!=='granted'){ if(!await askNotifPermission()) return; }
  var reg=await navigator.serviceWorker.ready;
  var list=dueToday();
  reg.showNotification(list.length? '今天要回顾 '+list.length+' 条':'今天没有排到的回顾',{
    body:list.length? notifBody(list):'记一笔，回顾链就会排上',
    icon:'icon-192.png', badge:'icon-192.png', tag:'test', data:{url:'./index.html'}});
  buzz(14); toast('已发出一条测试通知');
}
function renderNotifUI(){
  var sw=document.getElementById('notifSw');
  sw.classList.toggle('on', !!db.notify.on);
  document.getElementById('notifTimeRow').style.display = db.notify.on? 'flex':'none';
  document.getElementById('notifTestRow').style.display = db.notify.on? 'flex':'none';
  document.getElementById('notifTime').value=db.notify.time||'08:00';

  var rows=[
    ['精确定时通知', NOTIF.triggers? '可用':'不支持', NOTIF.triggers?
      '按你设的时间准点弹，纯本地，不经任何服务器。':'这个浏览器没有这个能力，已自动退到下面的通道。'],
    ['后台每日检查', NOTIF.periodic? '已注册':'未启用', NOTIF.periodic?
      '系统会在后台唤醒它，时间由系统决定，可能比设定时间晚。':'需要把网页装成应用、并且经常打开，系统才会授予。'],
    ['日历提醒', '始终可用', '最稳的一条。设置里导出 .ics，导进手机日历，由系统按时提醒。']
  ];
  document.getElementById('notifStatus').innerHTML=rows.map(function(r){
    var ok=(r[1]==='可用'||r[1]==='已注册'||r[1]==='始终可用');
    return '<div class="rowline"><div class="grow"><div>'+r[0]+'</div>'+
      '<div style="font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5">'+r[2]+'</div></div>'+
      '<div class="val" style="color:'+(ok?'var(--amber)':'var(--ink-3)')+'">'+r[1]+'</div></div>';
  }).join('');

  /* 日历同步状态 */
  var miss=icsMissing();
  var syncTxt = !db.ics.at ? '还没导出过 · 一周导一次就够'
    : (miss? '有 '+miss+' 条新排的回顾还没进日历' : '日历是最新的 · '+md(ymd(new Date(db.ics.at)))+' 导出');
  var el2=document.getElementById('icsSync');
  if(el2){ el2.textContent=syncTxt; el2.style.color = miss? 'var(--amber)':'var(--ink-3)'; }

  /* 顶部提示条：一次只出一条，优先提醒日历落后 */
  var b=document.getElementById('notifBanner');
  b.innerHTML='';
  if(db.ics.at && miss>=5){

var SLEEPS=['22:30','23:00','23:30','00:00','01:00'];

/* 搞懂了什么 → 拆成一件一件。按逗号、分号、句号、换行拆；
   不按顿号拆（「效力待定、可撤销」通常是一件事里的并列）。 */
function splitGot(s){
  return String(s||'').split(/[，,；;。\n]+/)
    .map(function(t){ return t.replace(/^\s*(搞懂了|懂了|理解了|明白了)\s*/,'').trim(); })
    .filter(function(t){ return t.length>=2; });
}
/* 只数带 gotV 标记的记录：以前的备注不是按「一段一件」写的，
   回头去数会得出假的效率，所以从这一版之后记的才算 */
function gotCount(r){ return (r&&r.gotV)? splitGot(r.note).length : 0; }
function renderGot(){
  var box=document.getElementById('gotPreview');
  var items=splitGot(document.getElementById('note').value);
  if(!items.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="gotline"><span class="gotn">'+items.length+' 件</span>'+
    items.map(function(t,i){ return '<span class="gotchip">'+(i+1)+' · '+esc(t)+'</span>'; }).join('')+'</div>';
}

/* db.daily['YYYY-MM-DD'] = {sleepAt:'23:30', release:1, spirit:1}
   睡点记的是「昨晚」，挂在今天——它影响的是今天的精神。
   精神是方向不是大小：−2 … +2，0 = 平常。 */
function fmtSpirit(v){ return v>0? '+'+v : (v<0? '−'+(-v) : '0'); }
var dayEditing=false;

  var o=db.daily[t]=db.daily[t]||{};
  if(o[field]===val||val===''||val==null) delete o[field]; else o[field]=val;
  if(!Object.keys(o).length) delete db.daily[t];

/* 老版本把睡点、压力挂在学习记录上，搬到当天的精神里 */
function migrateDaily(){
  var changed=false; db.daily=db.daily||{};
  db.records.slice().sort(function(a,b){return a.createdAt<b.createdAt?-1:1;}).forEach(function(r){
    if(!r.sleepAt) return;
    var o=db.daily[r.date]=db.daily[r.date]||{};
    if(!o.sleepAt){ o.sleepAt=r.sleepAt; changed=true; }
  });
  /* 精神从 1–5 换成 −2…+2：3 是平常 */
  Object.keys(db.daily).forEach(function(k){
    var o=db.daily[k];
    if(o.energy!=null){ if(o.spirit==null) o.spirit=Math.max(-2,Math.min(2,o.energy-3)); delete o.energy; changed=true; }
  });
  if(changed) save();
}

    stress:form.stress?+form.stress:null,

var chartView='daily';
var dailyOn={min:true,eff:true,stress:true,mood:true};
function renderChart(animate){
  var w=document.getElementById('chartWrap');
  if(chartView==='spirit') return drawSpirit(w);
  if(!db.records.length){ w.innerHTML='<div class="empty">记满几天，这里会长出你的节奏。</div>'; return; }
  if(chartView==='daily') return drawDaily(w);

/* 日课：横轴从 8/30 起逐日排到今天，左轴时长与页数，右轴压力与状态。
   没记录的日子曲线断开，不补 0。 */
var DAILY_START='2026-08-30';
function dailyDays(){
  var first=DAILY_START;
  db.records.forEach(function(r){ if(r.date<first) first=r.date; });
  Object.keys(db.daily||{}).forEach(function(k){ if(k<first) first=k; });
  var out=[],d=first,t=todayStr(),guard=0;
  while(d<=t && guard++<800){ out.push(d); d=addDays(d,1); }
  return out;
}
function dailySeries(days){
  var by={};
  db.records.forEach(function(r){ (by[r.date]=by[r.date]||[]).push(r); });
  return days.map(function(d){
    var rs=by[d];
    if(!rs) return {d:d,min:null,eff:null,stress:null,mood:null};
    var min=0,got=0,minGot=0,hasGot=false,sv=[],mv=[],i;
    for(i=0;i<rs.length;i++){
      min+=(+rs[i].minutes||0);
      var g=gotCount(rs[i]); if(g){ got+=g; minGot+=(+rs[i].minutes||0); hasGot=true; }
      if(rs[i].stress>0) sv.push(+rs[i].stress);
      if(rs[i].mood&&MOODVAL[rs[i].mood]) mv.push(MOODVAL[rs[i].mood]);
    }
    /* 压力：当天各次的平均；那几天压力记在精神卡片里的，用那个值兜底 */
    var st = sv.length? Math.round(sv.reduce(function(a,b){return a+b;},0)/sv.length*10)/10
                      : (dayOf(d).stress||null);
    /* 效率 = 搞懂的件数 ÷ 写了搞懂内容的那几次的学习小时数
       （没写的那几次不拖低效率，也不算进来） */
    var eff = (hasGot&&minGot>0)? Math.round(got/(minGot/60)*10)/10 : null;
    return {d:d,min:min||null,eff:eff,got:hasGot?got:null,stress:st,
      mood:mv.length? mv.reduce(function(a,b){return a+b;},0)/mv.length : null};
  });
}
function drawDaily(wrap){
  var days=dailyDays(),S=dailySeries(days),N=days.length;
  /* 每天固定间距，天数多了就横向滚动；天数少时拉满卡片宽度 */
  var PL=30,PR=26,PT=24,PB=32,H=276;
  var avail=Math.max(280,(wrap.clientWidth||340)+36);   // 通铺：把卡片左右内边距吃回来
  /* 装得下就按可用宽度铺满；装不下（约两周以上）才按每天 24px 横向滚动 */
  var fit=N>1? (avail-PL-PR)/(N-1) : avail;
  var step=Math.max(24,fit);
  var W=Math.max(avail, PL+PR+(N-1)*step);
  var iw=W-PL-PR,ih=H-PT-PB;
  function X(i){ return PL+(N<=1?iw/2:i*iw/(N-1)); }
  /* 左轴只放时长（分钟）；右轴放小整数量：效率（件/时）、压力、状态 */
  var maxL=Math.max(1,Math.max.apply(null,S.map(function(p){ return p.min||0; })));
  maxL=Math.ceil(maxL*1.15);
  var maxR=Math.max(5,Math.ceil(Math.max.apply(null,S.map(function(p){
    return dailyOn.eff?(p.eff||0):0; }))));
  function YL(v){ return PT+ih-(v/maxL)*ih; }
  function YR(v){ return PT+ih-(v/maxR)*ih; }

  /* 网格：0 有线无标签；左轴顶上标单位 */
  var g='<line x1="'+PL+'" y1="'+YL(0)+'" x2="'+(W-PR)+'" y2="'+YL(0)+'" stroke="rgba(0,0,0,.09)"/>'+
    '<text x="'+(PL-7)+'" y="'+(PT-10)+'" text-anchor="end" font-size="9.5" fill="#B5AFA3">分</text>';
  [maxL/2,maxL].forEach(function(v){
    g+='<line x1="'+PL+'" y1="'+YL(v)+'" x2="'+(W-PR)+'" y2="'+YL(v)+'" stroke="rgba(0,0,0,.05)"/>'+
      '<text x="'+(PL-7)+'" y="'+(YL(v)+4)+'" text-anchor="end" font-size="10.5" fill="#9C968D">'+Math.round(v)+'</text>';
  });
  (maxR>5? [Math.round(maxR/2),maxR] : [1,3,5]).forEach(function(v){
    g+='<text x="'+(W-PR+7)+'" y="'+(YR(v)+4)+'" text-anchor="start" font-size="10.5" fill="#C0B9AC">'+v+'</text>';
  });

  /* 断开的折线：连续非空才连 */
  function path(key,scale,color,width,dash){
    if(!dailyOn[key]) return '';
    var segs=[],cur=[];
    S.forEach(function(p,i){
      var v=p[key];
      if(v==null){ if(cur.length) segs.push(cur); cur=[]; return; }
      cur.push(X(i)+','+(scale===1?YL(v):YR(v)));
    });
    if(cur.length) segs.push(cur);
    return segs.map(function(sg){
      if(sg.length===1){
        var xy=sg[0].split(',');
        return '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="'+color+'"/>';
      }
      return '<polyline points="'+sg.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+width+
        '" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
    }).join('')+S.map(function(p,i){
      return p[key]==null?'':'<circle cx="'+X(i)+'" cy="'+(scale===1?YL(p[key]):YR(p[key]))+
        '" r="2.6" fill="'+color+'"/>'; }).join('');
  }
  var lines=path('min',1,'#CE8E12',2.5,'')+path('eff',2,'#6FA27A',2.2,'')+
            path('stress',2,'#B08BA5',1.8,'4 3')+path('mood',2,'#7E9BB5',1.8,'');

  /* 日期刻度：挤得下就每天都标，挤不下隔天标 */
  var every=(step>=30)?1:2;
  var labels=S.map(function(p,i){
    if(i%every!==0 && i!==N-1) return '';
    var dd=parseYMD(p.d), studied=p.min!=null;
    return '<text x="'+X(i)+'" y="'+(H-11)+'" text-anchor="middle" font-size="10.5" fill="'+
      (studied?'#6B665F':'#BDB7AC')+'">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>';
  }).join('');

  var LEG=[['min','时长','#CE8E12',''],['eff','效率','#6FA27A',''],
           ['stress','压力','#B08BA5','dash'],['mood','状态','#7E9BB5','']];
  wrap.innerHTML='<div class="chartscroll"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+
    g+lines+labels+'</svg></div>'+
    '<div class="legrow" id="dailyLeg">'+
    LEG.map(function(l){
      return '<span class="legchip'+(dailyOn[l[0]]?'':' off')+'" data-k="'+l[0]+'">'+
        '<i style="border-top:2.5px '+(l[3]?'dashed':'solid')+' '+l[2]+'"></i>'+l[1]+'</span>';
    }).join('')+'</div>'+
    (db.records.length<20? '<div class="empty" style="font-size:13.5px;margin-top:10px">再记一段时间，这里会看出规律。</div>':'');

  var sc=wrap.querySelector('.chartscroll');
  if(sc) sc.scrollLeft=sc.scrollWidth;          // 默认看最近这几天
  pinLeftAxis(wrap,PL,H);
  wrap.querySelectorAll('.legchip').forEach(function(c){
    c.onclick=function(){ buzz(8); var k=c.getAttribute('data-k'); dailyOn[k]=!dailyOn[k]; drawDaily(wrap); };
  });
}
/* 横向滚动时，左边的轴标签（带子名、刻度）钉住不动，图在它下面滑 */
function pinLeftAxis(wrap,PL,H){
  var sc=wrap.querySelector('.chartscroll'),svg=sc&&sc.querySelector('svg');
  if(!svg||sc.scrollWidth<=sc.clientWidth+1) return;
  var parts=Array.prototype.filter.call(svg.querySelectorAll('text'),function(t){
    return parseFloat(t.getAttribute('x'))<PL; }).map(function(t){ return t.outerHTML; }).join('');
  /* 右侧 14px 渐隐：图滑到轴下面时是淡出去，而不是被一刀切开 */
  var F=14,Wp=PL+F;
  var pin=document.createElement('div'); pin.className='axispin';
  pin.innerHTML='<svg width="'+Wp+'" height="'+H+'" viewBox="0 0 '+Wp+' '+H+'">'+
    '<defs><linearGradient id="pinfade" x1="0" x2="1" y1="0" y2="0">'+
      '<stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>'+
      '<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>'+
    '<rect width="'+(PL-4)+'" height="'+H+'" fill="#FFFFFF"/>'+
    '<rect x="'+(PL-4)+'" width="'+(F+4)+'" height="'+H+'" fill="url(#pinfade)"/>'+parts+'</svg>';
  wrap.style.position='relative';
  wrap.insertBefore(pin,sc);
  function upd(){ pin.style.opacity = sc.scrollLeft>2? '1':'0'; }
  sc.addEventListener('scroll',upd,{passive:true}); upd();
}
/* 精神：三条上下对齐的带子，共用一条日期轴。
   竖着看一列就是同一天：昨晚几点睡 → 今天释放几次 → 今天精神几分。 */
function sleepMin(s){
  var m=toMin(s); if(m==null) return null;
  if(m<12*60) m+=24*60;                 // 凌晨算作前一晚的延续
  return Math.max(21*60,Math.min(27*60,m));   // 21:00 – 03:00
}
function drawSpirit(wrap){
  var keys=Object.keys(db.daily||{}).filter(function(k){ return Object.keys(db.daily[k]).length; });
  if(!keys.length){
    wrap.innerHTML='<div class="empty">在「今天」页的精神卡片里点几下，这里就开始有东西了。</div>'; return;
  }
  var days=dailyDays(),N=days.length;
  var PL=46,PR=14,H=312;
  var avail=Math.max(280,(wrap.clientWidth||340)+36);
  var fit=N>1?(avail-PL-PR)/(N-1):avail, step=Math.max(24,fit);
  var W=Math.max(avail,PL+PR+(N-1)*step), iw=W-PL-PR;
  function X(i){ return PL+(N<=1?iw/2:i*iw/(N-1)); }

  /* 三条带子：带名写在每条带子的上方，刻度在左侧，互不挤 */
  var A={top:24,h:96}, B={top:150,h:78}, C={top:256,h:32};
  var yE=function(v){ return A.top+A.h/2-(v/2)*(A.h/2); };                 // 精神 −2…+2，0 在中线
  var yS=function(m){ return B.top+(m-21*60)/(6*60)*B.h; };                // 睡点：越晚越靠下
  /* 睡点记在第二天（「昨晚几点睡」），画回它真正发生的那一晚：
     第 i 列的睡点 = 第 i+1 天记下的「昨晚」 */
  var S=days.map(function(d){ var o=dayOf(d),nx=dayOf(addDays(d,1));
    return {d:d,e:(o.spirit!=null?o.spirit:null),s:nx.sleepAt?sleepMin(nx.sleepAt):null,
      r:(o.release!=null?o.release:null)}; });
  var maxR=Math.max(3,Math.max.apply(null,S.map(function(p){return p.r||0;})));
  var yR=function(v){ return C.top+C.h-(v/maxR)*C.h; };

  var g='';
  function bandLabel(txt,top){ return '<text x="4" y="'+(top-10)+'" font-size="11.5" fill="#6B665F" font-weight="600">'+txt+'</text>'; }
  function hline(y,dim){ return '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="rgba(0,0,0,'+(dim?'.045':'.08')+')"/>'; }
  function tick(y,txt){ return '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#A9A396">'+txt+'</text>'; }
  g+=bandLabel('精神',A.top)+hline(yE(2),1)+hline(yE(-2),1)+
     '<line x1="'+PL+'" y1="'+yE(0)+'" x2="'+(W-PR)+'" y2="'+yE(0)+'" stroke="rgba(0,0,0,.16)"/>'+
     tick(yE(2),'+2')+tick(yE(0),'0')+tick(yE(-2),'−2');
  g+=bandLabel('睡点',B.top)+hline(yS(22*60),1)+hline(yS(24*60),1)+hline(yS(26*60),1)+
     tick(yS(22*60),'22点')+tick(yS(24*60),'0点')+tick(yS(26*60),'2点');
  g+=bandLabel('释放',C.top)+hline(yR(0));

  function line(key,yf,color,w){
    var segs=[],cur=[];
    S.forEach(function(p,i){ var v=p[key];
      if(v==null){ if(cur.length) segs.push(cur); cur=[]; return; }
      cur.push(X(i)+','+yf(v)); });
    if(cur.length) segs.push(cur);
    return segs.map(function(sg){ return sg.length>1?
      '<polyline points="'+sg.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"/>':''; }).join('')+
      S.map(function(p,i){ return p[key]==null?'':'<circle cx="'+X(i)+'" cy="'+yf(p[key])+'" r="3" fill="'+color+'"/>'; }).join('');
  }
  var bw=Math.max(5,Math.min(13,step*0.45));
  var bars=S.map(function(p,i){
    if(p.r==null) return '';
    if(p.r===0) return '<circle cx="'+X(i)+'" cy="'+yR(0)+'" r="2.6" fill="none" stroke="#B08BA5" stroke-width="1.3"/>';
    return '<rect x="'+(X(i)-bw/2)+'" y="'+yR(p.r)+'" width="'+bw+'" height="'+(yR(0)-yR(p.r))+'" rx="3" fill="#C9A9BE"/>'+
      '<text x="'+X(i)+'" y="'+(yR(p.r)-3)+'" text-anchor="middle" font-size="9.5" fill="#9C8494">'+p.r+'</text>';
  }).join('');

  /* 精神：从 0 线往上（好）或往下（差）长的柱子；0 画一个小横条，表示记了、是平常 */
  var spirit=S.map(function(p,i){
    if(p.e==null) return '';
    if(p.e===0) return '<rect x="'+(X(i)-bw/2)+'" y="'+(yE(0)-1.5)+'" width="'+bw+'" height="3" rx="1.5" fill="#CFC9BD"/>';
    var up=p.e>0, y0=yE(0), y1=yE(p.e);
    return '<rect x="'+(X(i)-bw/2)+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.abs(y1-y0)+
      '" rx="3" fill="'+(up?'#E3AE45':'#9DB3C6')+'"/>';
  }).join('');

  var every=(step>=30)?1:2;
  var labels=S.map(function(p,i){
    if(i%every!==0&&i!==N-1) return '';
    var dd=parseYMD(p.d),has=p.e!=null||p.s!=null||p.r!=null;
    return '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="'+(has?'#6B665F':'#BDB7AC')+'">'+
      (dd.getMonth()+1)+'/'+dd.getDate()+'</text>';
  }).join('');

  wrap.innerHTML='<div class="chartscroll"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+
    g+spirit+line('s',yS,'#7E9BB5',2)+bars+labels+'</svg></div>'+
    '<div class="legrow">'+
      '<span class="still"><i style="border-top:8px solid #E3AE45;width:9px;border-radius:2px"></i>精神 +</span>'+
      '<span class="still"><i style="border-top:8px solid #9DB3C6;width:9px;border-radius:2px"></i>精神 −</span>'+
      '<span class="still"><i style="border-top:2.5px solid #7E9BB5"></i>睡点</span>'+
      '<span class="still"><i style="border-top:8px solid #C9A9BE;width:9px;border-radius:2px"></i>释放</span>'+
    '</div>'+
    (keys.length<20?'<div class="empty" style="font-size:13.5px;margin-top:10px">再记一段时间，这里会看出规律。</div>':'');
  var sc=wrap.querySelector('.chartscroll'); if(sc) sc.scrollLeft=sc.scrollWidth;
  pinLeftAxis(wrap,PL,H);
}
function heatColor(v,mx){ if(!v) return 'var(--quiet-2)';
  var s=['#FAEBC9','#F3D89A','#E9B44C','#CE8E12','#A9740A'];
  return s[Math.min(4,Math.floor(Math.min(1,v/(mx||1))*5*0.999))]; }
function drawHeat(wrap){
  var map=minutesByDay(),days=lastNDays(90);
  var mx=Math.max.apply(null,[1].concat(days.map(function(d){return map[d]||0;})));
  wrap.innerHTML='<div class="heat" id="heat"></div><div class="legend" id="hl"></div>';
  var h=document.getElementById('heat'),lead=parseYMD(days[0]).getDay(),cells=[],col=null;
  for(var i=0;i<lead;i++) cells.push(null);
  days.forEach(function(d){cells.push(d);});
  cells.forEach(function(d,i){
    if(i%7===0){ col=document.createElement('div'); col.className='heatcol'; h.appendChild(col); }
    var c=document.createElement('div'); c.className='cell';
    if(d){ var v=map[d]||0; c.style.background=heatColor(v,mx); c.title=d+(v?' · '+fmtDur(v):''); }
    else c.style.background='transparent';
    col.appendChild(c);
  });
  h.scrollLeft=h.scrollWidth;
  document.getElementById('hl').innerHTML='少 '+[0,mx*.2,mx*.45,mx*.7,mx].map(function(v){
    return '<span class="cell" style="background:'+heatColor(v,mx)+'"></span>';}).join('')+' 多';
}
function drawRadius(wrap,animate){
  var map=minutesByDay();
  var d30=lastNDays(30).map(function(d){return map[d]||0;}).filter(function(v){return v>0;});
  var d7=lastNDays(7).map(function(d){return map[d]||0;});
  var base=median(d30),peak=Math.max.apply(null,[0].concat(lastNDays(90).map(function(d){return map[d]||0;})));
  var avg7=d7.reduce(function(a,b){return a+b;},0)/7;
  var R=94,rmin=24,sc=peak>0?peak:1;
  function rad(v){ return rmin+(R-rmin)*Math.min(1,v/sc); }
  var rB=rad(base),rP=rad(peak),rA=rad(avg7);
  wrap.innerHTML='<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center">'+
    '<svg class="chart" viewBox="0 0 210 210" width="210" height="210">'+
    '<circle class="grow" id="cP" cx="105" cy="105" r="'+(animate?0:rP)+'" fill="none" stroke="#E6E3DA" stroke-width="1.5" stroke-dasharray="3 5"/>'+
    '<circle class="grow" id="cB" cx="105" cy="105" r="'+(animate?0:rB)+'" fill="#FAEBC9" stroke="#F0DCAE"/>'+
    '<circle class="grow" id="cA" cx="105" cy="105" r="'+(animate?0:rA)+'" fill="none" stroke="#CE8E12" stroke-width="2.5"/>'+
    '<circle cx="105" cy="105" r="2.5" fill="#CE8E12"/></svg>'+
    '<div style="min-width:170px;font-size:13.5px;color:var(--ink-2);line-height:2">'+
    '<div><span style="display:inline-block;width:20px;border-top:2.5px solid #CE8E12;vertical-align:middle"></span> 近 7 天平均 '+fmtDur(avg7)+'</div>'+
    '<div><span style="display:inline-block;width:20px;border-top:9px solid #FAEBC9;vertical-align:middle"></span> 30 天基线 '+fmtDur(base)+'</div>'+
    '<div><span style="display:inline-block;width:20px;border-top:2px dashed #DAD5C8;vertical-align:middle"></span> 最高 '+fmtDur(peak)+'</div>'+
    '<div style="margin-top:8px;color:var(--ink-3);font-size:13px">'+radiusWord(avg7,base)+'</div></div></div>';
  if(animate) setTimeout(function(){
    var a=document.getElementById('cP'),b=document.getElementById('cB'),c=document.getElementById('cA');
    if(a)a.setAttribute('r',rP); if(b)b.setAttribute('r',rB); if(c)c.setAttribute('r',rA); },60);
}
function radiusWord(a,b){
  if(b<=0) return '再记几天，基线就出来了。';
  if(a>=b*1.05) return '这条线正在往外挪。';
  if(a>=b*0.9) return '贴着基线走，稳。';
  return '这几天收着，也是节奏。';
}
var insightView='hour';
function bandOf(s){ var m=toMin(s); if(m==null) return null;
  var h=Math.floor(m/60); if(h<5) h+=24;
  for(var i=0;i<HOURBANDS.length;i++){ var b=HOURBANDS[i]; if(h>=b.s&&h<b.e) return b; } return null; }
function bandStats(){
  var g={};
  db.records.forEach(function(r){ var b=bandOf(r.start); if(!b) return;
    var o=g[b.k]=g[b.k]||{band:b,n:0,sum:0,smooth:0,moodN:0};
    o.n++; o.sum+=(+r.minutes||0);
    if(r.mood){ o.moodN++; if(r.mood==='顺') o.smooth++; } });
  return HOURBANDS.map(function(b){return g[b.k];}).filter(Boolean);
}
function bestBand(){
  var s=bandStats().filter(function(o){return o.n>=3&&o.moodN>=2;});
  if(!s.length) return null;
  s.sort(function(a,b){ return (b.smooth/b.moodN)-(a.smooth/a.moodN)||b.sum-a.sum; });
  return {k:s[0].band.k,s:s[0].band.s,e:s[0].band.e};
}
function renderInsight(){
  var w=document.getElementById('insightWrap');
  if(db.records.length<3){ w.innerHTML='<div class="empty">记够几次，这里会告诉你：什么时间、在哪儿，你的状态更好。</div>'; return; }
  if(insightView==='hour') return insHour(w);
  if(insightView==='place') return insGroup(w,'location','未标地点');
  return insWeek(w);
}
function insHour(w){
  var s=bandStats();
  if(!s.length){ w.innerHTML='<div class="empty">还没有带时间点的记录。</div>'; return; }
  var mx=Math.max.apply(null,s.map(function(o){return o.sum;}));
  var b=bestBand(),long=s.slice().sort(function(a,c){return c.sum/c.n-a.sum/a.n;})[0],lead='';
  if(b) lead='标"顺"最多的是<b>'+b.k+'</b>（'+b.s+'–'+(b.e%24)+' 点）。';
  if(long) lead+=(lead?' ':'')+'<b>'+long.band.k+'</b>单次坐得最久，平均 <b>'+Math.round(long.sum/long.n)+'</b> 分钟。';
  w.innerHTML='<div class="line" style="margin-bottom:14px">'+lead+'</div><table class="tbl">'+
    s.map(function(o){ var rate=o.moodN?Math.round(o.smooth/o.moodN*100):null;
      return '<tr><td style="width:30%">'+o.band.k+'<span style="color:var(--ink-3);font-size:12px;font-family:var(--mono)"> '+
        o.band.s+'–'+(o.band.e%24)+'</span></td><td><div class="bar" style="width:'+Math.max(4,Math.round(o.sum/mx*100))+
        '%"></div></td><td class="n">'+hnum(o.sum)+'h · '+o.n+' 次'+(rate!=null?' · 顺 '+rate+'%':'')+'</td></tr>';
    }).join('')+'</table>';
}
function insGroup(w,field,fallback){
  var g={};
  db.records.forEach(function(r){ var k=r[field]||fallback;
    var o=g[k]=g[k]||{n:0,sum:0,smooth:0,moodN:0};
    o.n++; o.sum+=(+r.minutes||0);
    if(r.mood){ o.moodN++; if(r.mood==='顺') o.smooth++; } });
  var list=Object.keys(g).map(function(k){var o=g[k];
    return {name:k,n:o.n,avg:o.sum/o.n,sum:o.sum,rate:o.moodN?o.smooth/o.moodN:null};})
    .sort(function(a,b){return b.avg-a.avg;});
  var named=list.filter(function(l){return l.name!==fallback&&l.n>=2;});
  var lead=named.length>=2? ('在<b>'+esc(named[0].name)+'</b>平均每次 <b>'+Math.round(named[0].avg)+
    '</b> 分钟，在<b>'+esc(named[named.length-1].name)+'</b>是 <b>'+Math.round(named[named.length-1].avg)+'</b> 分钟。')
    : '多标几次地点，这里会更有话说。';
  var mx=Math.max.apply(null,list.map(function(l){return l.avg;}));
  w.innerHTML='<div class="line" style="margin-bottom:14px">'+lead+'</div><table class="tbl">'+
    list.map(function(l){ return '<tr><td style="width:30%">'+esc(l.name)+'</td><td><div class="bar'+
      (l.name===fallback?' dim':'')+'" style="width:'+Math.max(4,Math.round(l.avg/mx*100))+'%"></div></td>'+
      '<td class="n">'+Math.round(l.avg)+' 分/次'+(l.rate!=null?' · 顺 '+Math.round(l.rate*100)+'%':'')+'</td></tr>';
    }).join('')+'</table>';
}
function insWeek(w){
  var wd=['周日','周一','周二','周三','周四','周五','周六'],g={};
  db.records.forEach(function(r){ var k=parseYMD(r.date).getDay();
    var o=g[k]=g[k]||{n:0,sum:0,smooth:0,moodN:0};
    o.n++; o.sum+=(+r.minutes||0);
    if(r.mood){ o.moodN++; if(r.mood==='顺') o.smooth++; } });
  var list=[1,2,3,4,5,6,0].filter(function(k){return g[k];}).map(function(k){ var o=g[k];
    return {name:wd[k],n:o.n,sum:o.sum,rate:o.moodN?o.smooth/o.moodN:null}; });
  var mx=Math.max.apply(null,list.map(function(l){return l.sum;}));
  var top=list.slice().sort(function(a,b){return b.sum-a.sum;})[0];
  w.innerHTML='<div class="line" style="margin-bottom:14px">目前 <b>'+esc(top.name)+
    '</b> 的总时长最多，累计 <b>'+fmtDur(top.sum)+'</b>。</div><table class="tbl">'+
    list.map(function(l){ return '<tr><td style="width:30%">'+l.name+'</td><td><div class="bar" style="width:'+
      Math.max(4,Math.round(l.sum/mx*100))+'%"></div></td><td class="n">'+hnum(l.sum)+'h · '+l.n+' 次'+
      (l.rate!=null?' · 顺 '+Math.round(l.rate*100)+'%':'')+'</td></tr>'; }).join('')+'</table>';
}

/* ================= 台账 ================= */
var lgMode='review',lgLimit=20;
function renderLedger(){
  var wrap=document.getElementById('ledger'),t=todayStr();
  document.getElementById('lgToggle').textContent=lgMode==='review'?'回顾中':'全部';
  var rows=db.records.slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?1:-1;
    return (b.start||'')<(a.start||'')?-1:1; });
  if(lgMode==='review') rows=rows.filter(function(r){return reviewsOf(r.id).length>0;});
  document.getElementById('lgCount').textContent=rows.length+' 行';
  if(!rows.length){ wrap.innerHTML='<div class="empty">'+(lgMode==='review'?
    '还没有排了回顾的内容。把类型标成「新学」，回顾链会自动排上。':'还没有记录。')+'</div>'; return; }
  var shown=rows.slice(0,lgLimit);
  var html='<div class="lgwrap"><table class="lg"><tr><th class="l">日期</th><th class="l">内容</th>'+
    [1,2,3,4,5].map(function(i){return '<th>'+i+' 回</th>';}).join('')+'</tr>';
  shown.forEach(function(r){
    var rv=reviewsOf(r.id),retired=rv.some(function(x){return x.status==='retired';}),meta=[];
    if(r.location) meta.push(r.location);
    if(r.type) meta.push(r.type);
    if(r.mood) meta.push(r.mood);
    meta.push(fmtDur(r.minutes));
    var cells='';
    for(var i=1;i<=5;i++){
      var x=rv.filter(function(v){return v.round===i;})[0];
      cells+='<td class="rc">'+cellHTML(x,retired,t)+'</td>';
    }
    html+='<tr><td class="cd"><span class="d">'+md(r.date)+'</span>'+
      (r.start?'<span class="h">'+r.start+'–'+r.end+'</span>':'')+'</td>'+
      '<td class="cc"><div>'+esc(r.content)+'</div><div class="m">'+esc(meta.join(' · '))+'</div></td>'+cells+'</tr>';
  });
  html+='</table></div>';
  if(rows.length>shown.length) html+='<div style="margin-top:14px"><button class="ghost tap" id="lgMore">还有 '+
    (rows.length-shown.length)+' 行 · 展开</button></div>';
  wrap.innerHTML=html;
  var more=document.getElementById('lgMore');
  if(more) more.onclick=function(){ buzz(8); lgLimit+=40; renderLedger(); };
  wrap.querySelectorAll('.rcell[data-rid]').forEach(function(c){
    c.onclick=function(){ buzz(10); pickMood(c.parentNode,c.getAttribute('data-rid')); }; });
}
function cellHTML(x,retired,t){
  if(!x) return retired?'<span class="rcell none">—</span>':'<span class="rcell none">·</span>';
  if(x.status==='done'){ var dd=x.completedAt?md(ymd(new Date(x.completedAt))):md(x.dueDate);
    return '<span class="rcell done">'+dd+' ✓</span>'; }
  if(x.status==='retired') return '<span class="rcell none">熟</span>';
  var cls = daysBetween(x.dueDate,t)>=0 ? 'due' : 'soon';
  return '<span class="rcell '+cls+'" data-rid="'+x.id+'">'+md(x.dueDate)+'</span>';
}
function pickMood(td,rid){
  td.innerHTML='<div class="rpick">'+MOODS.map(function(m){return '<button data-m="'+m+'">'+m+'</button>';}).join('')+'</div>';
  td.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ completeReview(rid,b.getAttribute('data-m')); }; });
}

/* ================= 记录 / 内容库 ================= */
function recNode(r,showDate){
  var meta=[];
  if(showDate) meta.push(md(r.date));
  if(r.start) meta.push(r.start+'–'+r.end);
  if(r.mood) meta.push(r.mood);
  if(r.stress) meta.push('压力 '+r.stress);
  var gc=gotCount(r); if(gc) meta.push('懂了 '+gc+' 件');
  if(r.location) meta.push(r.location);
  var nx=reviewsOf(r.id).filter(function(x){return x.status==='pending';})[0];
  var node=el('<div class="item"><div class="min">'+fmtDur(r.minutes)+'</div><div class="c">'+
    '<div class="t">'+esc(r.content)+'</div>'+
    (meta.length?'<div class="m">'+esc(meta.join(' · '))+'</div>':'')+
    (nx?'<div class="m" style="color:var(--amber)">下次回顾 '+md(nx.dueDate)+'</div>':'')+
    (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+
    '</div><button class="del">×</button></div>');
  node.querySelector('.del').onclick=function(){
    if(!confirm('删掉这条记录？')) return;
    db.records=db.records.filter(function(x){return x.id!==r.id;});
    db.reviews=db.reviews.filter(function(x){return x.sourceId!==r.id;});
    buzz(14); save(); renderAll(); scheduleNotifications(); toast('删了');
  };
  return node;
}
function renderRecords(){
  var t=todayStr(),tw=document.getElementById('todayRecs'); tw.innerHTML='';
  var td=db.records.filter(function(r){return r.date===t;});
  var sum=td.reduce(function(a,r){return a+(+r.minutes||0);},0);
  document.getElementById('todaySum').textContent=td.length?fmtDur(sum):'';
  if(!td.length) tw.innerHTML='<div class="empty">今天还没记。写一行就好，不用完整。</div>';
  else td.slice().reverse().forEach(function(r){ tw.appendChild(recNode(r,false)); });
  var aw=document.getElementById('allRecs'); aw.innerHTML='';
  var rest=db.records.filter(function(r){return r.date!==t;})
    .sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,60);
  if(!rest.length) aw.innerHTML='<div class="empty">还没有更早的记录。</div>';
  else rest.forEach(function(r){ aw.appendChild(recNode(r,true)); });
}
var subjFilter=null;
function renderLibrary(){
  var wrap=document.getElementById('library'),fw=document.getElementById('subjFilter');
  if(!db.records.length){ fw.innerHTML=''; wrap.innerHTML='<div class="empty">学过的内容会自动汇到这里。</div>'; return; }
  var subs={}; db.records.forEach(function(r){ subs[r.subject||subjectOf(r.content)]=1; });
  fw.innerHTML='';
  ['全部'].concat(Object.keys(subs).sort()).forEach(function(s){
    var v=s==='全部'?null:s;
    var b=el('<div class="tag'+(subjFilter===v?' on':'')+'">'+esc(s)+'</div>');
    b.onclick=function(){ buzz(8); subjFilter=v; renderLibrary(); };
    fw.appendChild(b);
  });
  var g={};
  db.records.forEach(function(r){
    var sub=r.subject||subjectOf(r.content);
    if(subjFilter&&sub!==subjFilter) return;
    var o=g[r.content]=g[r.content]||{content:r.content,times:0,minutes:0,last:''};
    o.times++; o.minutes+=(+r.minutes||0); if(r.date>o.last) o.last=r.date;
  });
  var list=Object.keys(g).map(function(k){return g[k];}).sort(function(a,b){return a.last<b.last?1:-1;});
  if(!list.length){ wrap.innerHTML='<div class="empty">这个科目下还没有记录。</div>'; return; }
  wrap.innerHTML='';
  list.forEach(function(o){
    var ago=daysBetween(o.last,todayStr()),cur=db.mastery[o.content]||null;
    var node=el('<div class="item"><div class="c"><div class="t">'+esc(o.content)+'</div>'+
      '<div class="m">'+o.times+' 次 · '+fmtDur(o.minutes)+' · 上次 '+(ago===0?'今天':ago+' 天前')+'</div>'+
      '<div class="acts">'+['还生','有点熟','很熟'].map(function(m){
        return '<button class="mini'+(cur===m?' on':'')+'" data-m="'+m+'">'+m+'</button>';}).join('')+
      '</div></div></div>');
    node.querySelectorAll('.mini').forEach(function(b){
      b.onclick=function(){ buzz(8); var m=b.getAttribute('data-m');
        db.mastery[o.content]=(db.mastery[o.content]===m?null:m); save(); renderLibrary(); }; });
    wrap.appendChild(node);
  });
}

/* ================= 导出 ================= */
function download(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},1000);
}
function exportJSON(){
  download(new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),records:db.records,
    reviews:db.reviews,mastery:db.mastery,notify:db.notify,calHour:db.calHour||null,
    daily:db.daily||{},backfill:db.backfill||{}},null,2)],
    {type:'application/json'}),'学习节奏-'+todayStr()+'.json');
  buzz(12); toast('已导出备份');
}
function exportCSV(){
  var head=['日期','开始','结束','分钟','内容','科目','状态','地点','搞懂了什么','懂了件数',
    '睡点','释放','精神','压力'];
  for(var i=1;i<=5;i++) head.push(i+'回日期',i+'回状态');
  var lines=[head.join(',')];
  db.records.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(r){
    var rv=reviewsOf(r.id),o=dayOf(r.date);
    var row=[r.date,r.start||'',r.end||'',r.minutes,r.content,r.subject||'',
      r.mood||'',r.location||'',r.note||'',gotCount(r)||'',
      o.sleepAt||r.sleepAt||(r.sleep?'早睡':''),(o.release!=null?o.release:''),
      (o.spirit!=null?fmtSpirit(o.spirit):''),r.stress||o.stress||''];
    for(var i=1;i<=5;i++){
      var x=rv.filter(function(v){return v.round===i;})[0];
      row.push(x?x.dueDate:'', x?({pending:'待回顾',done:'已完成',retired:'已熟'}[x.status]||x.status):'');
    }
    lines.push(row.map(function(v){ v=String(v==null?'':v);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','));
  });
  download(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),'学习台账-'+todayStr()+'.csv');
  buzz(12); toast('已导出 CSV');
}
function icsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
/* 未来每一天要回顾什么：过期没做的全部折进「今天」 */
function calendarDays(){
  var t=todayStr(),map={},td=dueToday();
  if(td.length) map[t]=td;
  for(var i=1;i<=120;i++){
    var d=addDays(t,i),l=dueOn(d);
    if(l.length) map[d]=l;
  }
  return map;
}
/* 日历里还差多少条没同步 */
function icsMissing(){
  var now=calendarDays(),old=(db.ics&&db.ics.days)||{},n=0;
  Object.keys(now).forEach(function(d){ n+=Math.max(0, now[d].length-(old[d]||0)); });
  return n;
}
/* 一天一条事件：到点一次提醒，列出当天全部要回顾的内容。
   UID 用日期，所以重复导入是覆盖更新，不会堆重复。 */
function exportICS(){
  var days=calendarDays(), keys=Object.keys(days).sort();
  if(!keys.length){ toast('现在没有排着的回顾'); return; }
  var def=db.calHour||db.notify.time||'08:00';
  var t=prompt('日历里几点提醒你？',def);
  if(t===null) return;
  t=String(t).trim();
  if(!/^\d{1,2}:\d{2}$/.test(t)){ toast('时间写成 08:00 这样'); return; }
  var hh=pad(parseInt(t.split(':')[0],10)),mm=pad(parseInt(t.split(':')[1],10));
  db.calHour=hh+':'+mm;
  var now=new Date();
  var stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+
    pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  var endM=parseInt(mm,10)+20,endH=parseInt(hh,10)+Math.floor(endM/60);
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//学习节奏//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  var total=0;

  keys.forEach(function(day){
    var list=days[day], d=day.replace(/-/g,'');
    total+=list.length;
    var body=list.map(function(r,i){
      return (i+1)+'. '+r.content+'（第 '+r.round+' 回）';
    }).join('\n');
    L.push('BEGIN:VEVENT','UID:day-'+d+'@study-rhythm','DTSTAMP:'+stamp,'SEQUENCE:'+Math.floor(Date.now()/60000%100000),
      'DTSTART:'+d+'T'+hh+mm+'00','DTEND:'+d+'T'+pad(endH%24)+pad(endM%60)+'00',
      'SUMMARY:'+icsEsc('回顾 '+list.length+' 条 · '+list[0].content.slice(0,12)+(list.length>1?' 等':'')),
      'DESCRIPTION:'+icsEsc(body+'\n\n打开「学习节奏」，逐条标记顺 / 一般 / 卡。'),
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY',
      'DESCRIPTION:'+icsEsc('今天要回顾 '+list.length+' 条'),'END:VALARM','END:VEVENT');
  });

  /* 上次导过、现在已经空掉的那些天：撤掉旧提醒 */
  var live={}; keys.forEach(function(k){ live[k]=1; });
  Object.keys((db.ics&&db.ics.days)||{}).forEach(function(day){
    if(live[day]) return;
    var d=day.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:day-'+d+'@study-rhythm','DTSTAMP:'+stamp,'SEQUENCE:'+Math.floor(Date.now()/60000%100000+1),
      'DTSTART:'+d+'T'+hh+mm+'00','DTEND:'+d+'T'+hh+mm+'01',
      'SUMMARY:'+icsEsc('回顾'),'STATUS:CANCELLED','END:VEVENT');
  });

  /* 旧版是「一条回顾一个事件」，换成按天之后那批旧事件不会自己消失，
     这里按原 UID 逐条撤销，撤完就不再重复发。 */
  (db.ics.legacyIds||[]).forEach(function(id){
    var old=db.reviews.filter(function(x){return x.id===id;})[0];
    var d0=(old? old.dueDate : todayStr()).replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:'+id+'@study-rhythm','DTSTAMP:'+stamp,'SEQUENCE:9',
      'DTSTART:'+d0+'T'+hh+mm+'00','DTEND:'+d0+'T'+hh+mm+'01',
      'SUMMARY:'+icsEsc('回顾'),'STATUS:CANCELLED','END:VEVENT');
  });

  L.push('END:VCALENDAR');
  var sig={}; keys.forEach(function(k){ sig[k]=days[k].length; });
  db.ics={at:new Date().toISOString(),days:sig,legacyIds:[]};
  save();
  download(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'学习回顾-'+todayStr()+'.ics');
  buzz(12); renderAll();
  toast(keys.length+' 天 · '+total+' 条已导出');
}
function importJSON(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.records)) throw new Error('格式不对');
      var merge=db.records.length? confirm('已有 '+db.records.length+' 条记录。\n\n确定 = 合并\n取消 = 用文件覆盖全部'):false;
      if(!merge){ db.records=d.records; db.reviews=d.reviews||[]; db.mastery=d.mastery||{};
        db.daily=d.daily||{}; if(d.backfill) db.backfill=d.backfill; }
      else{
        var h={}; db.records.forEach(function(r){h[r.id]=1;});
        d.records.forEach(function(r){ if(!h[r.id]) db.records.push(r); });
        var h2={}; db.reviews.forEach(function(r){h2[r.id]=1;});
        (d.reviews||[]).forEach(function(r){ if(!h2[r.id]) db.reviews.push(r); });
        Object.keys(d.mastery||{}).forEach(function(k){ if(!db.mastery[k]) db.mastery[k]=d.mastery[k]; });
        db.daily=db.daily||{};
        Object.keys(d.daily||{}).forEach(function(k){
          db.daily[k]=Object.assign({}, d.daily[k], db.daily[k]||{}); });
      }
      save(); renderAll(true); scheduleNotifications(); buzzOK(); toast('导入完成 · 共 '+db.records.length+' 条');
    }catch(e){ alert('这个文件读不了：'+e.message); }
  };
  fr.readAsText(file);
}

/* ================= 导航 ================= */
var TITLES={today:'今天',ledger:'台账',data:'数据',set:'设置'};
function go(v){
  document.querySelectorAll('.view').forEach(function(s){ s.classList.toggle('on', s.id==='v-'+v); });
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===v); });
  document.getElementById('hdrTitle').textContent=TITLES[v];
  window.scrollTo({top:0,behavior:'auto'});
  if(v==='data') renderChart(chartView==='radius');
}
function renderAll(animate){
  renderPlan(); renderDay(); renderStats(); renderLedger(); renderChart(!!animate&&chartView==='radius');
  renderInsight(); renderRecords(); renderLibrary(); renderNotifUI();
  document.getElementById('dataStat').textContent=
    db.records.length+' 条记录 · '+pendings().length+' 条待回顾 · '+(storageOK?'本地存储正常':'本地存储不可用');
}
function bindSeg(id,cb){
  var box=document.getElementById(id);
  box.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ buzz(8);
      box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); cb(b.getAttribute('data-v')); };
  });
}
function init(){
  load();
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ storageOK=false; }
  migratePlans(); migrateDaily(); catchUp();
  var t=today(),wd=['周日','周一','周二','周三','周四','周五','周六'][t.getDay()];
  document.getElementById('todayDate').textContent=(t.getMonth()+1)+' 月 '+t.getDate()+' 日 · '+wd;
  buildTags(); sync();

  document.getElementById('saveBtn').onclick=addRecord;
  document.getElementById('customDur').addEventListener('input',renderTimeRow);
  document.getElementById('dayEdit').onclick=function(){ buzz(8); dayEditing=!dayEditing; renderDay(); };
  document.getElementById('backfillBtn').onclick=function(){
    buzz(10);
    if(backfillLeft()<=0){ toast('本月的两次补签用完了，下个月再来'); return; }
    var inp=document.getElementById('backfillDate');
    inp.max=addDays(todayStr(),-1); inp.min=addDays(todayStr(),-60);
    inp.value=addDays(todayStr(),-1);
    form.backfill=inp.value; sync();
  };
  document.getElementById('backfillDate').onchange=function(){
    if(!this.value) return;
    if(this.value>=todayStr()){ toast('补签只能补过去的日子'); this.value=addDays(todayStr(),-1); }
    form.backfill=this.value; sync();
  };
  document.getElementById('backfillCancel').onclick=function(){ buzz(8); form.backfill=null; sync(); };
  document.getElementById('note').addEventListener('input',sync);
  document.getElementById('content').addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('note').focus(); } });
  document.getElementById('note').addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); this.blur(); addRecord(); } });
  document.getElementById('lgToggle').onclick=function(){ buzz(8); lgMode=lgMode==='review'?'all':'review'; lgLimit=20; renderLedger(); };
  document.getElementById('csvBtn').onclick=exportCSV;
  document.getElementById('icsBtn').onclick=exportICS;
  document.getElementById('exportBtn').onclick=exportJSON;
  document.getElementById('importBtn').onclick=function(){ document.getElementById('fileInput').click(); };
  document.getElementById('fileInput').onchange=function(e){
    if(e.target.files&&e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
  document.getElementById('notifSw').onclick=function(){ buzz(10); toggleNotif(); };
  document.getElementById('notifTest').onclick=testNotification;
  document.getElementById('notifTime').onchange=function(){
    db.notify.time=this.value||'08:00'; save(); scheduleNotifications();
    buzz(8); toast('提醒时间改为 '+db.notify.time); };
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.onclick=function(){ buzz(9); go(b.getAttribute('data-v')); }; });
  bindSeg('segChart',function(v){ chartView=v; renderChart(v==='radius'); });
  bindSeg('segInsight',function(v){ insightView=v; renderInsight(); });

  window.addEventListener('scroll',function(){
    document.getElementById('hdr').classList.toggle('stuck', window.scrollY>28); },{passive:true});
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){ catchUp(); renderAll(); scheduleNotifications(); } });

  renderAll(true);
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(function(){
      mirrorToIDB();
      if(db.notify.on){ registerPeriodic().then(renderNotifUI); scheduleNotifications(); }
    }).catch(function(){});
  }
}
init();
</script>
